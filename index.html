<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha Clássico</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #222831;
            color: #eceff1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 10px;
            color: #00adb5;
        }

        #status {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
        }

        .cell {
            background-color: #393e46;
            border: none;
            border-radius: 8px;
            font-size: 2.5rem;
            font-weight: bold;
            color: #eeeeee;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .cell:hover {
            background-color: #4f5660;
        }

        .cell.X {
            color: #ff5722;
        }

        .cell.O {
            color: #00adb5;
        }

        #reset {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #00adb5;
            color: #eeeeee;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        #reset:hover {
            background-color: #007a80;
        }
    </style>
</head>
<body>

    <h1>Jogo da Velha</h1>
    <div id="status">Vez do jogador X</div>

    <div class="board">
        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>
        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>
        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>
    </div>

    <button id="reset" onclick="resetGame()">Reiniciar Jogo</button>

    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let isGameActive = true;

        const statusDisplay = document.getElementById("status");
        const cells = document.querySelectorAll(".cell");

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Linhas
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Colunas
            [0, 4, 8], [2, 4, 6]             // Diagonais
        ];

        cells.forEach(cell => cell.addEventListener("click", handleCellClick));

        function handleCellClick(event) {
            const clickedCell = event.target;
            const clickedCellIndex = parseInt(clickedCell.getAttribute("data-index"));

            if (board[clickedCellIndex] !== "" || !isGameActive) {
                return;
            }

            makeMove(clickedCell, clickedCellIndex);
            checkResult();
        }

        function makeMove(cell, index) {
            board[index] = currentPlayer;
            cell.textContent = currentPlayer;
            cell.classList.add(currentPlayer);
        }

        function checkResult() {
            let roundWon = false;

            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                statusDisplay.textContent = `Jogador ${currentPlayer} Venceu! 🎉`;
                isGameActive = false;
                return;
            }

            if (!board.includes("")) {
                statusDisplay.textContent = "Empate! 🤝";
                isGameActive = false;
                return;
            }

            currentPlayer = currentPlayer === "X" ? "O" : "X";
            statusDisplay.textContent = `Vez do jogador ${currentPlayer}`;
        }

        function resetGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            isGameActive = true;
            statusDisplay.textContent = `Vez do jogador ${currentPlayer}`;
            cells.forEach(cell => {
                cell.textContent = "";
                cell.classList.remove("X", "O");
            });
        }
    </script>
</body>
</html><body>
    
</body>
</html>
